name: Pi Skill Contract Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".atomcode/skills/thirdparty-library-discovery/**"
      - ".atomcode/skills/harmony-contribution-orchestrator/**"
      - ".atomcode/skills/harmony-article-check/**"
      - ".atomcode/skills/harmony-article-writing/**"
      - "resources/frameworks.yaml"
      - "resources/article-rules.yaml"
      - "tests/pi/discovery-contract.prompt.md"
      - "tests/pi/assert_discovery_contract.py"
      - "tests/pi/official-handoff-contract.prompt.md"
      - "tests/pi/assert_official_handoff_contract.py"
      - "tests/pi/orchestrator-contract.prompt.md"
      - "tests/pi/assert_orchestrator_contract.py"
      - "tests/pi/article-check-contract.prompt.md"
      - "tests/pi/assert_article_check_contract.py"
      - "tests/pi/article-writing-contract.prompt.md"
      - "tests/pi/assert_article_writing_contract.py"
      - "scripts/ci/test-pi-skill.sh"
      - ".github/workflows/pi-skill-test.yml"
  pull_request:
    paths:
      - ".atomcode/skills/thirdparty-library-discovery/**"
      - ".atomcode/skills/harmony-contribution-orchestrator/**"
      - ".atomcode/skills/harmony-article-check/**"
      - ".atomcode/skills/harmony-article-writing/**"
      - "resources/frameworks.yaml"
      - "resources/article-rules.yaml"
      - "tests/pi/discovery-contract.prompt.md"
      - "tests/pi/assert_discovery_contract.py"
      - "tests/pi/official-handoff-contract.prompt.md"
      - "tests/pi/assert_official_handoff_contract.py"
      - "tests/pi/orchestrator-contract.prompt.md"
      - "tests/pi/assert_orchestrator_contract.py"
      - "tests/pi/article-check-contract.prompt.md"
      - "tests/pi/assert_article_check_contract.py"
      - "tests/pi/article-writing-contract.prompt.md"
      - "tests/pi/assert_article_writing_contract.py"
      - "scripts/ci/test-pi-skill.sh"
      - ".github/workflows/pi-skill-test.yml"

permissions:
  contents: read

concurrency:
  group: pi-skill-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    # GitHub does not expose repository secrets to forked pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: discovery
            skill_name: thirdparty-library-discovery
            skill_path: .atomcode/skills/thirdparty-library-discovery/SKILL.md
            prompt_file: tests/pi/discovery-contract.prompt.md
            assert_script: tests/pi/assert_discovery_contract.py
          - id: official-handoff
            skill_name: thirdparty-library-discovery
            skill_path: .atomcode/skills/thirdparty-library-discovery/SKILL.md
            prompt_file: tests/pi/official-handoff-contract.prompt.md
            assert_script: tests/pi/assert_official_handoff_contract.py
          - id: orchestrator
            skill_name: harmony-contribution-orchestrator
            skill_path: .atomcode/skills/harmony-contribution-orchestrator/SKILL.md
            prompt_file: tests/pi/orchestrator-contract.prompt.md
            assert_script: tests/pi/assert_orchestrator_contract.py
          - id: article-check
            skill_name: harmony-article-check
            skill_path: .atomcode/skills/harmony-article-check/SKILL.md
            prompt_file: tests/pi/article-check-contract.prompt.md
            assert_script: tests/pi/assert_article_check_contract.py
          - id: article-writing
            skill_name: harmony-article-writing
            skill_path: .atomcode/skills/harmony-article-writing/SKILL.md
            prompt_file: tests/pi/article-writing-contract.prompt.md
            assert_script: tests/pi/assert_article_writing_contract.py

    name: contract-${{ matrix.id }}

    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_BASE_URL: https://api.agnes-ai.cn/v1
      PI_MODEL: agnes-2.5-flash
      PI_CONTRACT_TIMEOUT_SECONDS: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Require Agnes API secret
        shell: bash
        run: |
          if [[ -z "${AGNES_API_KEY:-}" ]]; then
            echo "::error::Repository secret AGNES_API_KEY is not configured."
            exit 1
          fi

      - name: Install Pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.83.0

      - name: Run ${{ matrix.id }} contract
        shell: bash
        run: >-
          bash scripts/ci/test-pi-skill.sh
          "${{ matrix.id }}"
          "${{ matrix.skill_name }}"
          "${{ matrix.skill_path }}"
          "${{ matrix.prompt_file }}"
          "${{ matrix.assert_script }}"

      - name: Upload Pi output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-${{ matrix.id }}-agnes-2.5-flash-output
          path: .artifacts/pi/
          if-no-files-found: ignore
