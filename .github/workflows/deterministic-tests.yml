name: Deterministic Discovery Tests

on:
  push:
    branches:
      - main
    paths:
      - "tests/unit/**"
      - "tests/pi/live/collect_flutter_evidence.py"
      - "tests/pi/live/collect_official_flutter_search_evidence.py"
      - "tests/pi/live/collect_flutter_candidate_activity_evidence.py"
      - "tests/pi/live/normalize_official_flutter_result.py"
      - "scripts/qualification/**"
      - "scripts/orchestrator/**"
      - "scripts/article/**"
      - "scripts/ci/check-github-actions-runtime.py"
      - "resources/frameworks.yaml"
      - "resources/article-rules.yaml"
      - "examples/e2e-fixture/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "tests/unit/**"
      - "tests/pi/live/collect_flutter_evidence.py"
      - "tests/pi/live/collect_official_flutter_search_evidence.py"
      - "tests/pi/live/collect_flutter_candidate_activity_evidence.py"
      - "tests/pi/live/normalize_official_flutter_result.py"
      - "scripts/qualification/**"
      - "scripts/orchestrator/**"
      - "scripts/article/**"
      - "scripts/ci/check-github-actions-runtime.py"
      - "resources/frameworks.yaml"
      - "resources/article-rules.yaml"
      - "examples/e2e-fixture/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python3 -m pip install PyYAML==6.0.2

      - name: Check GitHub Actions Node 24 runtime compatibility
        run: python3 scripts/ci/check-github-actions-runtime.py

      - name: Run deterministic discovery regressions
        run: python3 tests/unit/test_discovery_helpers.py

      - name: Run deterministic orchestrator gate regressions
        run: python3 tests/unit/test_orchestrator_gate.py

      - name: Run deterministic framework route regressions
        run: python3 tests/unit/test_framework_route.py

      - name: Run deterministic orchestrator next-action regressions
        run: python3 tests/unit/test_orchestrator_next_action.py

      - name: Run deterministic validation gate regressions
        run: python3 tests/unit/test_validation_gate.py

      - name: Run structured article rule regressions
        run: python3 tests/unit/test_article_rules.py

      - name: Run deterministic article static checker regressions
        run: python3 tests/unit/test_article_static_check.py

      - name: Run full article compliance aggregation regressions
        run: python3 tests/unit/test_article_compliance_report.py

      - name: Run article material pack regressions
        run: python3 tests/unit/test_article_material_pack.py

      - name: Run fixture-only article pipeline E2E regression
        run: python3 tests/unit/test_e2e_article_fixture.py
