name: Deterministic Discovery Tests

on:
  push:
    branches:
      - main
    paths:
      - "tests/unit/**"
      - "tests/pi/live/collect_flutter_evidence.py"
      - "tests/pi/live/collect_official_flutter_search_evidence.py"
      - "tests/pi/live/collect_flutter_candidate_activity_evidence.py"
      - "tests/pi/live/normalize_official_flutter_result.py"
      - "scripts/qualification/**"
      - "scripts/orchestrator/**"
      - "scripts/ci/check-github-actions-runtime.py"
      - "resources/frameworks.yaml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "tests/unit/**"
      - "tests/pi/live/collect_flutter_evidence.py"
      - "tests/pi/live/collect_official_flutter_search_evidence.py"
      - "tests/pi/live/collect_flutter_candidate_activity_evidence.py"
      - "tests/pi/live/normalize_official_flutter_result.py"
      - "scripts/qualification/**"
      - "scripts/orchestrator/**"
      - "scripts/ci/check-github-actions-runtime.py"
      - "resources/frameworks.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: python3 -m pip install PyYAML==6.0.2

      - name: Check GitHub Actions Node 24 runtime compatibility
        run: python3 scripts/ci/check-github-actions-runtime.py

      - name: Run deterministic discovery regressions
        run: python3 tests/unit/test_discovery_helpers.py

      - name: Run deterministic orchestrator gate regressions
        run: python3 tests/unit/test_orchestrator_gate.py

      - name: Run deterministic framework route regressions
        run: python3 tests/unit/test_framework_route.py
