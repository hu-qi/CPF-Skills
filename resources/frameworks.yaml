schema_version: 1

# 这里只维护候选发现、去重和官方 Skill 路由所需的可变事实。
# 版本号、SDK 版本等如果不是当前流程必需，不在这里提前固化；需要时应实时确认。

# 一个社区/框架族可能包含多个互斥技术栈。族名不能静默映射到其中一个变体，
# 调用方必须显式选择具体 variant，避免把 C/C++ 任务误送入 ArkTS porting Skill。
framework_families:
  applicationtpc:
    aliases: [applicationtpc, application-tpc]
    variants: [arkts, cpp]

frameworks:
  flutter:
    display_name: Flutter
    aliases: [flutter]
    discovery_status: supported
    version_policy: latest
    discovery_sources:
      - name: pub.dev
        url: https://pub.dev/
        type: package_registry
    dedup_sources:
      - name: CPF-Flutter ThirdpartyLibrarites
        url: https://atomgit.com/CPF-Flutter/docs/blob/main/ThirdpartyLibrarites.md
        required: true
      - name: CPF-Flutter
        url: https://atomgit.com/CPF-Flutter
        required: true
      - name: hxa-flutter
        url: https://atomgit.com/hxa-flutter
        required: true
    official_skills:
      repository: https://atomgit.com/CPF-Flutter/skills
      library_search: flutter-library-search
      adaptation_necessity_check: ohos-flutter-plugin-adaptation-necessity-check
      # 当前已审计能力用于搜索/必要性判断；未确认独立实际移植实现 Skill。
      adaptation_implementation: null
    community:
      name: CPF-Flutter 鸿蒙社区
      organization: https://atomgit.com/CPF-Flutter

  react-native:
    display_name: React Native
    aliases: [rn, react-native, react_native]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: React Native Directory
        url: https://reactnative.directory/
        type: package_directory
      - name: npm
        url: https://www.npmjs.com/
        type: package_registry
    dedup_sources:
      - name: CPF-RN
        url: https://atomgit.com/CPF-RN
        required: true
      - name: hxa-rn
        url: https://atomgit.com/hxa-rn
        required: true
    official_skills:
      repository: https://atomgit.com/CPF-RN/skills
      audit_status: audited
      # 2026-09-06 对官方仓当前 HEAD 的 CI 审计确认以下业务能力存在。
      interface_analyzer: rnoh-lib-interface-analyzer
      code_check: rnoh-lib-code-check
      demo_doc: rnoh-lib-demo-doc
      demo_gen: rnoh-lib-demo-gen
      xts_gen: rnoh-lib-xts-gen
      # 当前审计未发现独立的 porting/migration 实际移植 Skill。
      adaptation_implementation: null
    community:
      name: CPF-RN 鸿蒙社区
      organization: https://atomgit.com/CPF-RN

  arkts:
    display_name: ApplicationTPC (ArkTS)
    aliases: [arkts, applicationtpc-arkts]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: npm
        url: https://www.npmjs.com/
        type: package_registry
    dedup_sources:
      - name: CPF-ApplicationTPC
        url: https://atomgit.com/CPF-ApplicationTPC
        required: true
    official_skills:
      repository: https://atomgit.com/CPF-ApplicationTPC/skills
      audit_status: audited
      audit_commit: 08938711a65ddf92ead2fbe97315ecb458876d8a
      # 2026-09-06 官方 HEAD 审计确认：先做迁移分析，再由 porting Skill 实际生成 ArkTS/ETS + HAR。
      migration_analyzer: ohos-library-migration-analyzer
      adaptation_implementation: ohos-library-porting
      interface_analyzer: library-interface-analyzer
      spec_analyzer: ohos-library-spec-analyzer
      code_check: ohos-code-check
      library_check: ohos-library-check
      unit_test: ohos-library-unit-test
      demo_scenario: ohos-demo-scenario-generator
      demo_gen: ohos-demo-code-generator
      demo_doc: ohos-arkts-demo-doc-generator
      xts_gen: ohos-xts-code-generator
      xts_doc: ohos-xts-doc-generator
    community:
      name: CPF-ApplicationTPC 原生库社区
      organization: https://atomgit.com/CPF-ApplicationTPC

  cpp:
    display_name: ApplicationTPC (C/C++)
    aliases: [cpp, c++, c-cpp, applicationtpc-cpp]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: npm
        url: https://www.npmjs.com/
        type: package_registry
    dedup_sources:
      - name: CPF-ApplicationTPC
        url: https://atomgit.com/CPF-ApplicationTPC
        required: true
    official_skills:
      repository: https://atomgit.com/CPF-ApplicationTPC/skills
      audit_status: audited
      audit_commit: 08938711a65ddf92ead2fbe97315ecb458876d8a
      # migration-analyzer 明确覆盖 C/C++ 项目的依赖、guard、CMake/NDK 与 .so 迁移分析。
      migration_analyzer: ohos-library-migration-analyzer
      # ohos-library-porting 当前主实现流程面向 ArkTS/ETS + HAR；没有足够证据证明其为完整 C/C++ NDK 实现 Skill。
      adaptation_implementation: null
    community:
      name: CPF-ApplicationTPC 原生库社区
      organization: https://atomgit.com/CPF-ApplicationTPC

  kmp-cmp:
    display_name: KMP / CMP
    aliases: [kmp, cmp, kmp-cmp, kotlin-multiplatform, compose-multiplatform]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: Maven Repository
        url: https://mvnrepository.com/
        type: package_registry
    dedup_sources:
      - name: CPF-KMP-CMP
        url: https://atomgit.com/CPF-KMP-CMP
        required: true
    official_skills: {}
    community:
      name: KMP&CMP 鸿蒙社区
      organization: https://atomgit.com/CPF-KMP-CMP

  cordova:
    display_name: Cordova
    aliases: [cordova]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: npm
        url: https://www.npmjs.com/
        type: package_registry
    dedup_sources:
      - name: CPF-Cordova
        url: https://atomgit.com/CPF-Cordova
        required: true
    official_skills: {}
    community:
      name: CPF-Cordova 鸿蒙社区
      organization: https://atomgit.com/CPF-Cordova

  ionic:
    display_name: Ionic
    aliases: [ionic, capacitor]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: npm
        url: https://www.npmjs.com/
        type: package_registry
    dedup_sources:
      - name: CPF-Ionic
        url: https://atomgit.com/CPF-Ionic
        required: true
    official_skills: {}
    community:
      name: CPF-Ionic 鸿蒙社区
      organization: https://atomgit.com/CPF-Ionic

  cjmp:
    display_name: CJMP
    aliases: [cjmp, cangjie, 仓颉]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: 仓颉包管理中心
        url: https://pkg.cangjie-lang.cn/
        type: package_registry
    dedup_sources:
      - name: cj-awesome
        url: https://atomgit.com/cj-awesome
        required: true
      - name: Cangjie-TPC
        url: https://atomgit.com/Cangjie-TPC
        required: true
      - name: CJMP
        url: https://atomgit.com/CJMP
        required: true
    official_skills: {}
    community:
      name: CJMP 仓颉跨端社区
      organization: https://atomgit.com/CJMP

  electron:
    display_name: Electron
    aliases: [electron]
    discovery_status: experimental
    version_policy: latest
    discovery_sources:
      - name: npm
        url: https://www.npmjs.com/
        type: package_registry
    dedup_sources:
      - name: CPF-Electron
        url: https://atomgit.com/CPF-Electron
        required: true
    official_skills: {}
    community:
      name: CPF-Electron 鸿蒙社区
      organization: https://atomgit.com/CPF-Electron
